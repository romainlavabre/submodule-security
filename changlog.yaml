5.2.0: |
    Additive.
      - KratosIdentities.updateEmail() changes the login email of an identity, marked verified as on creation.
        409 IDP_IDENTITY_ALREADY_EXISTS when another identity already logs in with it.
5.1.0: |
    Administration of the Ory identities and clients, and scopes enforced on client_credentials tokens.
    Additive, except for applications implementing PrincipalResolver themselves.
      - SecurityConfigurer.requireClientScopes(): a client token must carry the audience, and the scope
        <prefix>:read on GET, HEAD and OPTIONS, <prefix>:write on any other method (403 otherwise). The prefix
        is the audience, or setClientScopePrefix(). A user token is never concerned. Opt-in.
      - PrincipalResolver.evictIdentity() and evictClient() drop a cached principal.
      - KratosIdentities is added: list (paginated), find, findByEmail, replaceMetadataAdmin, setActive, delete,
        revokeSessions.
      - CreateIdentity.create( email, metadataAdmin ) is added.
      - HydraClients: create with metadata, list (paginated), find, updateScopes, updateAudiences and
        replaceMetadata are added.
      - The ids put in an admin URL are checked (letters, digits, - and _ only), 400 otherwise.
5.0.0: |
    Migration to Ory: Kratos for the users (email code, backend for frontend, JWT minted by the tokenizer),
    Hydra for the machine to machine clients (client_credentials). AWS Cognito is removed entirely.
    BREAKING:
      - The host application must declare a PrincipalProvider bean: roles and attributes are resolved from
        its own tables (findIdentity( sub ), findClient( clientId )), no identity provider carries them anymore.
        Resolutions are cached (setPrincipalCacheMaxSize(), setPrincipalCacheTtlSeconds()).
      - Security.hasUser() and hasClient() follow the type of the Principal, getClientId() reads azp then
        client_id, getScopes() reads scp then scope, getAttribute() reads the Principal attributes.
        hasRole() compares the exact role name, ROLE_ prefix included.
      - Security only builds an identity on an endpoint requiring a token, as the filter chain does.
      - SecurityConfigurer: setCognitoUrl(), addClient(), addAllowedClientId(), setUserPoolId(), setAwsRegion()
        and setAwsCredentials() are removed. addIssuerWithJwks(), setAudience(), setKratosPublicUrl(),
        setKratosAdminUrl(), setKratosTokenizeAs() and setHydraAdminUrl() are added.
      - A token whose aud does not contain the configured audience is rejected. An unknown issuer or a malformed
        token answers 401 instead of 500.
      - POST /auth/token is removed. POST /auth/login and POST /auth/login/verify drive the Kratos email code
        login, POST /auth/revoke is renamed POST /auth/logout. The CLIENT_ID cookie is removed, KRATOS_FLOW is
        added.
      - CreateIdentity only takes the email, groups and attributes are removed along with AddIdentityToGroup.
        CreateIdentity and FetchIdentity return the Kratos identity id.
      - HydraClients is added (create, rotateSecret, delete).
4.0.1: Add support for reverse proxy prefix (cookies)
4.0.0: |
    Migration to AWS Cognito, as resource server and backend for frontend.
    BREAKING:
      - User, UserRepository, PasswordEncoder, JwtTokenHandler and the refresh token persistence are removed,
        the host application now owns its user entity.
      - Security.getId() returns the custom attribute external_id, -1 when absent, use getAuthenticationId()
        to read the Cognito sub.
      - Security.getRoles() returns a Collection instead of a Set. Roles come from the cognito:groups claim,
        prefixed by ROLE_ when needed.
      - POST /auth/token takes auth_code, auth_client_id and auth_redirect_uri instead of auth_username and
        auth_password. It answers {"exp": ...}, tokens are set as HttpOnly cookies.
      - Everything is configured through SecurityConfigurer, the module reads no environment variable anymore.
        setJwtSecret() and setJwtLifeTime() are removed, addIssuer(), addClient(), setCognitoUrl(),
        addAllowedClientId(), addSameSiteNoneDomain() and setSessionCookiePath() are added.
